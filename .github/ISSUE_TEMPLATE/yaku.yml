name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 新編芭蕉一代集. 連句篇 下・句評篇・紀行日記篇 "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: ndl-1190045-0001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
